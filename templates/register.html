<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register | Food Rescue Connect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#19875476,#2885a7);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    border:none;
    border-radius:20px;
}

.form-control,.form-select{
    border-radius:10px;
}

.btn-success{
    border-radius:10px;
    font-weight:bold;
}
</style>


    <meta name="theme-color" content="#172554">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg">

<div class="card-body p-5">

<h2 class="text-center text-success mb-2">
🍲 Food Rescue Connect
</h2>

<h4 class="text-center mb-4">
Create Account
</h4>

<form action="/register" method="POST">

<div class="mb-3">
<label>Full Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" name="email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" name="password" required>
</div>

<div class="mb-3">
<label>Select Role</label>

<select class="form-select" name="role" required>

<option value="">Choose Role</option>

<option value="donor">Donor</option>

<option value="ngo">NGO</option>

<option value="volunteer">Volunteer</option>

<option value="admin">Admin</option>

</select>

</div>

<button class="btn btn-success w-100">
Create Account
</button>

</form>

<hr>

<p class="text-center">

Already have an account?

<a href="/login">
Login
</a>

</p>

</div>

</div>

</div>

</div>

</div>


<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("/service-worker.js").catch(error => console.error("Service worker registration failed:", error)); }); }</script>

</body>
</html>
