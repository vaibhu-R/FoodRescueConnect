<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | Food Rescue Connect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#19875476,#2885a7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    border:none;
    border-radius:20px;
}

.form-control{
    border-radius:10px;
}

.btn-success{
    border-radius:10px;
    font-weight:bold;
}

</style>


    <meta name="theme-color" content="#172554">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow-lg">

<div class="card-body p-5">

<h2 class="text-center text-success mb-4">
🍲 Food Rescue Connect
</h2>

<h4 class="text-center mb-4">
Login
</h4>

<form method="POST">

<div class="mb-3">

<label>Email</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope"></i>
</span>

<input
type="email"
name="email"
class="form-control"
required>

</div>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock"></i>
</span>

<input
type="password"
id="password"
name="password"
class="form-control"
required>

<button
class="btn btn-outline-secondary"
type="button"
onclick="showPassword()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<button class="btn btn-success w-100">

Login

</button>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="/register">

Register Here

</a>

</p>

</div>

</div>

</div>

</div>

</div>

<script>

function showPassword(){

let x=document.getElementById("password");

if(x.type==="password")
x.type="text";
else
x.type="password";

}

</script>


<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("/service-worker.js").catch(error => console.error("Service worker registration failed:", error)); }); }</script>

</body>
</html>
