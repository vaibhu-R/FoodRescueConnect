<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta name="theme-color" content="#172554">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
    <div class="container-fluid">
        <span class="navbar-brand">
            Admin Dashboard
        </span>
    </div>
</nav>

<div class="container mt-4">

<div class="row">

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">
<h5>Total Users</h5>
<h2>{{ total_users }}</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">
<h5>Total Donations</h5>
<h2>{{ total_donations }}</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">
<h5>Total Requests</h5>
<h2>{{ total_requests }}</h2>
</div>
</div>
</div>

</div>

</div>

<div class="card mt-4">
    <div class="card-header">
        <h4>📊 Project Statistics</h4>
    </div>

    <div class="card-body">
        <canvas id="dashboardChart"></canvas>
    </div>
</div>
<a href="/download_report" class="btn btn-success mb-3">
    📄 Download PDF Report
</a>
<script>
const ctx = document.getElementById('dashboardChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Users', 'Donations', 'Requests'],
        datasets: [{
            label: 'Project Data',
            data: [
                {{ total_users }},
                {{ total_donations }},
                {{ total_requests }}
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("/service-worker.js").catch(error => console.error("Service worker registration failed:", error)); }); }</script>

</body>

</html>
